name: Validate LazyCat package

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  lazycat:
    uses: ca-x/lazycat-github-action/.github/workflows/lazycat.yml@v1
    with:
      operation: build
      config: .github/lazycat-action.yml
      dry-run: true
      toolchains: node
      node-version: "22"
      node-package-manager: npm

