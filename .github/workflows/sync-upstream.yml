name: Sync upstream release

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag latest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPOSITORY: MartinDelophy/ai-video-editor
        run: |
          set -euo pipefail

          latest_tag="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest" --jq .tag_name)"

          if [[ ! "${latest_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported upstream release tag: ${latest_tag}" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${latest_tag}" >/dev/null 2>&1; then
            echo "${latest_tag} is already synchronized"
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "${latest_tag}" -m "Timeline Studio ${latest_tag}"
          git push origin "refs/tags/${latest_tag}"

          gh workflow run lazycat-release.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${latest_tag}"
