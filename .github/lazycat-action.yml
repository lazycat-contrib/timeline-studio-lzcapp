version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist-lpk/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: git

build:
  toolchains:
    - kind: node
      version: "22"
  run_buildscript: true

images: []

stores:
  official:
    enabled: false
    skip_if_version_exists: false
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Timeline Studio
    summary: "Built from the matching upstream Timeline Studio release tag."

